name: Verify
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  shadybank-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: andrew867/shadybank
          ref: trunk
          path: contract-bank
      - name: Verify actual member client and API contract
        env:
          ADSI_CONTRACT_CLIENT_ROOT: ${{ github.workspace }}
        run: |
          # Until the initial member API PR merges, only the exact pre-API trunk
          # baseline may use its reviewed immutable candidate. Later trunk changes
          # must contain a working member contract; never silently fall back.
          if [ "$(git -C contract-bank rev-parse HEAD)" = 5079bcd819f38bb61b687bac55bcc4eedc3883b5 ]; then
            git -C contract-bank fetch --depth=1 origin 3ba3f4c5c6a80a2dfafedcb844046fd80ad330b6
            git -C contract-bank checkout --detach FETCH_HEAD
          fi
          test -f contract-bank/tests/test_adsi_contract.py
          python -m pip install -r service/requirements.txt aiohttp==3.11.13 asyncpg==0.30.0 passlib==1.7.4 argon2-cffi==23.1.0
          python -m unittest discover -s contract-bank/tests -p test_adsi_contract.py -v
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate source and fixtures
        run: |
          python -m pip install -r service/requirements.txt
          python tests/check_design.py
          PYTHONPATH=service python -m unittest discover -s tests -v
          g++ -std=c++20 -Wall -Wextra -Werror -I terminal-emu tests/terminal_vectors.cpp terminal-emu/terminal.cpp -o /tmp/terminal-vectors
          /tmp/terminal-vectors
          git diff --check
      - name: Build local lab
        run: |
          python deploy/init_lab.py
          docker compose --profile verify build
          docker compose --profile verify up -d --no-build --wait gateway app reference
      - name: Verify module inventories and SIP calls
        run: |
          sh tests/check-modules.sh
          PYTHONPATH=service python tests/check_pcm.py
          sh tests/smoke.sh
          python tests/check_admission.py
          python tests/live_dtmf.py
          python tests/live_api.py
          python tests/live_sip_app.py
          python tests/live_balance_demo.py
          ADSI_SHADYBANK_MODE=demo docker compose up -d --no-deps --wait app
          docker compose exec -T app python - < tests/check_shadybank_lockout.py
          PYTHONPATH=service python tests/live_shadybank.py
          PYTHONPATH=service python tests/live_extra_services.py
          ADSI_FDM_ENABLE=1 docker compose up -d --no-deps --wait app
          python tests/live_resident.py
      - name: Verify the operator console in Chromium
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Verify host-published emulator SIP ingress
        run: |
          docker compose -p coinline-adsi-emu -f compose.yaml -f compose.emu.yaml --profile verify build gateway app terminal-emu
          docker compose -p coinline-adsi-emu -f compose.yaml -f compose.emu.yaml --profile verify up -d --no-build --wait gateway app
          python tests/live_emu_ingress.py
          ADSI_EMU_INTERACTION_PROFILE=voice-between-screens docker compose -p coinline-adsi-emu -f compose.yaml -f compose.emu.yaml up -d --no-build --wait app
          python tests/live_mixed_profile.py --network container:coinline-adsi-emu-gateway-1 --image coinline-adsi-emu-terminal --profile voice-between-screens
      - name: Exercise capacity and resident persistence
        if: github.event_name == 'schedule'
        run: |
          python tests/load_lab.py
          python tests/live_capacity.py
      - name: Show service state after failure
        if: failure()
        run: docker compose --profile verify ps -a
  native-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build optional native applications
        run: |
          python deploy/init_lab.py
          docker compose -f compose.yaml -f compose.native.yaml build gateway
          docker compose -f compose.yaml -f compose.native.yaml up -d --no-deps --wait gateway
          sh tests/check-native.sh
