; Dedicated private LAN ingress. No peer is admitted by username alone.
[co-lan-transport]
type=transport
protocol=udp
bind=0.0.0.0:5070
local_net=@CONTAINER_IP@/32
external_signaling_address=@HOST_IP@
external_signaling_port=5070
external_media_address=@HOST_IP@

[co]
type=endpoint
transport=co-lan-transport
context=coinline-co-lan
identify_by=ip
disallow=all
allow=ulaw
callerid=CoinLine Lab <@CALLER_ID@>
trust_id_inbound=no
direct_media=no
dtmf_mode=inband
force_rport=yes
rtp_symmetric=yes
rewrite_contact=yes
media_address=@HOST_IP@
bind_rtp_to_media_address=no
allow_subscribe=no
allow_transfer=no

[co-lan-identify]
type=identify
endpoint=co
match=@PEER_IP@/32
