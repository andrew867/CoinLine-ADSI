; Host-published loopback transport. Keep the authenticated default transport separate.
[emu-transport]
type=transport
protocol=udp
bind=0.0.0.0:5069
local_net=@EMU_CONTAINER_IP@/32
external_signaling_address=127.0.0.1
external_signaling_port=5069

[co]
type=endpoint
transport=emu-transport
context=coinline-emu
identify_by=username
disallow=all
allow=ulaw
callerid=CoinLine Emu <@EMU_CALLER_ID@>
trust_id_inbound=no
direct_media=no
dtmf_mode=inband
force_rport=yes
rtp_symmetric=yes
rewrite_contact=yes
media_address=127.0.0.1
bind_rtp_to_media_address=no
allow_subscribe=no
allow_transfer=no
