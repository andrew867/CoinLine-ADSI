[global]
type=global
endpoint_identifier_order=username,auth_username

[transport]
type=transport
protocol=udp
bind=0.0.0.0:5060

[lab]
type=endpoint
transport=transport
context=coinline
disallow=all
allow=ulaw
auth=lab-auth
identify_by=username,auth_username
trust_id_inbound=yes
direct_media=no
dtmf_mode=inband
force_rport=yes
rtp_symmetric=yes
allow_subscribe=no
allow_transfer=no

[lab-auth]
type=auth
auth_type=userpass
username=lab
password=@SIP_PASSWORD@
