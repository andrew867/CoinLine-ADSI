<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoinLine Private Balance</title>
<style>
  body { max-width:38rem; margin:2rem auto; padding:0 1rem; background:#edf1f4; color:#20303e; font:16px system-ui }
  section { background:#fff; padding:1rem; border:1px solid #cbd5de; margin-block:1rem; border-radius:6px }
  label { display:grid; gap:.3rem; margin:.7rem 0 }
  input,button,select { padding:.5rem; font:inherit }
  output { display:block; font:bold 1.25rem monospace; padding:.5rem 0 }
</style>
<h1>Private balance</h1>
<a href="/auth/login">Sign in</a> · <a href="/">Console</a>
<p id="status" role="status"></p>
<section>
  <h2>Connect a SimpleFIN account</h2>
  <form id="claim" hidden><label>Setup Token<input id="token" type="password" autocomplete="off" required></label>
    <button>Claim token and find accounts</button></form>
  <button id="resume" hidden>Resume saved setup</button>
  <button id="discard" hidden>Discard pending setup</button>
  <form id="bind" hidden>
    <label>Account<select id="account"></select></label>
    <label>Display alias<input id="alias" maxlength="18" placeholder="Savings" required></label>
    <label>Enrolled line number<input id="phone" maxlength="14" type="tel" required></label>
    <button>Link account</button>
  </form>
  <button id="unlink" hidden>Unlink account</button>
  <button id="verify" hidden>Test read-only connection</button>
  <output id="verification" aria-live="polite"></output>
</section>
<section id="call-approval" hidden>
  <h2>Approve a call</h2>
  <form id="approval">
    <label>Challenge shown on the phone<input id="challenge" inputmode="numeric" maxlength="8" required></label>
    <button>Show one-time code</button>
  </form>
  <output id="code" aria-live="polite"></output>
</section>
<script>
  const byId = id => document.getElementById(id);
  async function api(path, method="GET", payload) {
    const result = await fetch("/api/v1/enrollment" + path, {
      method, headers:{"X-Coinline-CSRF":"request","Content-Type":"application/json"},
      body:payload === undefined ? undefined : JSON.stringify(payload),
      cache:"no-store",
    });
    const data = await result.json();
    if (!result.ok) throw new Error(typeof data.detail === "string" ? data.detail : "The request could not be completed.");
    return data;
  }
  function show(message) { byId("status").textContent = message; }
  function error(reason) { show(reason.message); }
  async function refresh() {
    const state = await api("");
    byId("claim").hidden = state.pending;
    byId("unlink").hidden = !state.linked;
    byId("verify").hidden = !state.linked;
    byId("resume").hidden = !state.claimed;
    byId("discard").hidden = !state.pending;
    byId("call-approval").hidden = !state.call_approval;
    show(state.pending ? (state.claimed ? "Access saved. Resume account selection." : "Claim status uncertain. Check SimpleFIN Bridge before discarding.") : state.linked ? "Linked account: " + state.alias : "No account linked");
  }
  function selectAccounts(accounts) {
    byId("account").replaceChildren(...accounts.map(account => new Option(account.label, account.id)));
    byId("bind").hidden = false;
    byId("claim").hidden = true;
    byId("resume").hidden = true;
    byId("discard").hidden = false;
    show("Access saved. Choose the account to link.");
  }
  byId("claim").onsubmit = event => {
    event.preventDefault();
    const token = byId("token").value;
    byId("token").value = "";
    byId("claim").hidden = true;
    show("Claiming setup token…");
    api("/bank-link", "POST", {token}).then(selectAccounts).catch(async reason => { await refresh().catch(error); error(reason); });
  };
  byId("resume").onclick = () => api("/resume", "POST").then(selectAccounts).catch(error);
  byId("discard").onclick = () => {
    if (confirm("Check or revoke the pending connection in SimpleFIN Bridge first. Discard this local setup?"))
      api("/pending", "DELETE").then(() => { byId("bind").hidden = true; return refresh(); }).catch(error);
  };
  byId("bind").onsubmit = event => {
    event.preventDefault();
    api("", "PUT", {phone:byId("phone").value, alias:byId("alias").value, choice:byId("account").value})
      .then(() => { byId("bind").hidden = true; byId("bind").reset(); return refresh(); }).catch(error);
  };
  byId("unlink").onclick = () => {
    if (confirm("Unlink the locally stored connection? You can revoke the Access URL in SimpleFIN Bridge."))
      api("", "DELETE").then(() => { byId("verification").textContent = ""; return refresh(); }).catch(error);
  };
  byId("verify").onclick = async () => {
    byId("verify").disabled = true;
    byId("verification").textContent = "Checking…";
    try {
      const result = await api("/verify", "POST");
      const freshness = {current:"Current balance", stale:"Stale balance timestamp", future:"Future-dated balance timestamp"}[result.freshness];
      byId("verification").textContent = `Connection verified · ${freshness} · ${result.currency} ${result.posted} · as of ${result.as_of} · ${result.transactions_shown} recent posted transactions`;
    } catch (reason) { byId("verification").textContent = ""; error(reason); }
    finally { byId("verify").disabled = false; }
  };
  byId("approval").onsubmit = event => {
    event.preventDefault();
    byId("code").textContent = "";
    api("/call-approval", "POST", {challenge:byId("challenge").value})
      .then(result => { byId("code").textContent = result.code; setTimeout(() => { byId("code").textContent = ""; }, 120000); })
      .catch(error);
  };
  refresh().catch(error);
</script>
</html>
